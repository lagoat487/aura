name: Refresh AURA link cache
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Refresh only changed AURA assets (respect GitHack rate limits)
        shell: bash
        run: |
          set -euo pipefail
          files=()
          while IFS= read -r file; do
            case "$file" in
              *.js|*.css) files+=("$file") ;;
            esac
          done < <(git diff --name-only HEAD^ HEAD || true)
          # Refresh scripts and styles before the HTML exposes their new cache keys.
          files+=(mobile.html index.html)
          declare -A seen=()
          for file in "${files[@]}"; do
            if [[ -n "${seen[$file]:-}" ]]; then continue; fi
            seen[$file]=1
            echo "Refreshing $file"
            url="https://raw.githack.com/lagoat487/aura/main/${file}"
            if ! curl --fail --silent --show-error --max-time 20 --retry 1 --retry-delay 8 -G -X DELETE --data-urlencode "url=$url" "https://raw.githack.com/purge"; then
              echo "::warning::GitHack cache purge rate-limited for $file; GitHub main is already updated."
              break
            fi
            sleep 2
          done

      - name: Verify the fixed AURA URL serves the current entrypoint
        shell: bash
        run: |
          set -euo pipefail
          live="https://raw.githack.com/lagoat487/aura/main/index.html"
          for attempt in 1 2 3 4; do
            if curl --fail --location --silent --show-error --max-time 20 -H 'Cache-Control: no-cache' "$live" -o /tmp/aura-live-index.html; then
              if cmp -s index.html /tmp/aura-live-index.html; then
                echo "Verified the fixed URL serves this release of index.html."
                exit 0
              fi
            fi
            echo "Fixed URL still returns an older HTML version (attempt $attempt)."
            sleep 5
          done
          echo "::warning::The release is committed on main but the fixed GitHack URL still appears stale."
          exit 0

