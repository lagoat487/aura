name: Refresh AURA link cache
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Refresh only changed AURA assets (respect GitHack rate limits)
        shell: bash
        run: |
          set -euo pipefail
          files=(index.html)
          while IFS= read -r file; do
            case "$file" in
              *.html|*.js|*.css) files+=("$file") ;;
            esac
          done < <(git diff --name-only HEAD^ HEAD || true)
          declare -A seen=()
          for file in "${files[@]}"; do
            if [[ -n "${seen[$file]:-}" ]]; then continue; fi
            seen[$file]=1
            echo "Refreshing $file"
            url="https://raw.githack.com/lagoat487/aura/main/${file}"
            if ! curl --fail --silent --show-error --max-time 20 --retry 1 --retry-delay 8 -X DELETE "https://raw.githack.com/purge?url=$url"; then
              echo "::warning::GitHack cache purge rate-limited for $file; GitHub main is already updated."
              break
            fi
            sleep 2
          done
