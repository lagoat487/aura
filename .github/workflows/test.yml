name: Verify published AURA files
on:
  push:
    branches: [fix/dcp-keyboard-focus-20261105]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8fbc5a545efe5f61402dc0c37984f4753858da40
      - name: Recheck the exact runtime after the accepted cache purge
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          for asset in 'index.html' 'ultimate-ui-6.js?v=6.0' 'ultimate-ui-6.js'; do
            file="${asset%%\?*}"
            matched=0
            for attempt in 1 2 3 4; do
              if curl --fail --location --silent --show-error --max-time 15 -H 'Cache-Control: no-cache' "https://raw.githack.com/lagoat487/aura/main/$asset" -o /tmp/aura-live-asset; then
                if cmp -s "$file" /tmp/aura-live-asset; then
                  echo "MATCH: $asset equals published 8fbc5a545efe5f61402dc0c37984f4753858da40"
                  matched=1
                  break
                fi
                echo "STALE: $asset differs from published 8fbc5a545efe5f61402dc0c37984f4753858da40 (attempt $attempt)"
                sha256sum "$file" /tmp/aura-live-asset
              fi
              if [[ "$attempt" != 4 ]]; then sleep 10; fi
            done
            if [[ "$matched" != 1 ]]; then
              echo "::error::Could not verify the served $asset against published 8fbc5a545efe5f61402dc0c37984f4753858da40."
              failed=1
            fi
          done
          exit "$failed"
