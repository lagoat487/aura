name: Verify published AURA files
on:
  push:
    branches: [fix/match-touch-b6eb9f43]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b619626089a20d6e1b747321e9737d04e95966a4
      - name: Recheck served files after the accepted purge without further invalidations
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6 7 8; do
            verified=1
            for asset in 'index.html' 'match-ui.js?v=7.8-continuous' 'match-ui.js'; do
              file="${asset%%\?*}"
              if curl --fail --location --silent --show-error --max-time 10 -H 'Cache-Control: no-cache' "https://raw.githack.com/lagoat487/aura/main/$asset" -o /tmp/aura-live-asset; then
                if cmp -s "$file" /tmp/aura-live-asset; then
                  echo "MATCH: $asset equals published b619626089a20d6e1b747321e9737d04e95966a4 (attempt $attempt)"
                  continue
                fi
                echo "STALE: $asset differs from published b619626089a20d6e1b747321e9737d04e95966a4 (attempt $attempt)"
                sha256sum "$file" /tmp/aura-live-asset
              fi
              verified=0
            done
            if [[ "$verified" == 1 ]]; then
              echo "VERIFIED: all served files match published b619626089a20d6e1b747321e9737d04e95966a4."
              exit 0
            fi
            if [[ "$attempt" != 8 ]]; then sleep 15; fi
          done
          echo "::error::Cache still does not serve the complete published revision b619626089a20d6e1b747321e9737d04e95966a4."
          exit 1
