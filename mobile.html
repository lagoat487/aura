    .aura-mobile-verified-banner{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;

    .aura-mobile-verified-banner>span:last-child{font-weight:500;color:#d4f1d9;font-size:10px}

      body.aura-mobile-entry .app-shell{padding-left:12px;padding-right:12px}

      .aura-mobile-verified-banner>span:last-child{font-size:10px;margin-top:5px}

      body.aura-mobile-entry .aura-mode-tile{display:block;min-height:0;border-radius:11px}
      body.aura-mobile-entry .aura-mode-launch{display:flex;min-height:190px;padding:17px 19px 49px}
      body.aura-mobile-entry .aura-mode-tile-top{margin:0 0 9px}
      body.aura-mobile-entry .aura-mode-launch>strong{font-size:clamp(25px,7.7vw,32px)}
      body.aura-mobile-entry .aura-mode-description{font-size:12px}
      body.aura-mobile-entry .aura-mode-cta{margin-top:12px;padding-top:6px}
      body.aura-mobile-entry .aura-mode-detail-header{min-height:0;padding:22px 18px;gap:9px}
      body.aura-mobile-entry .aura-mode-detail-header h1{font-size:clamp(31px,8vw,48px)}
      body.aura-mobile-entry .aura-mode-detail-symbol{font-size:46px}
      body.aura-mobile-entry .aura-mode-back{min-height:42px}
    }
    @media(prefers-reduced-motion:reduce){body.aura-mobile-entry .aura-mode-page{animation:none}}
